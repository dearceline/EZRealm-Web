[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezrealm-web"
version = "1.0.0"
description = "Chinese SSH menu and secure loopback web management for Realm v2.7.0"
requires-python = ">=3.11"
dependencies = ["tomlkit==0.13.3"]
license = "MIT"

[tool.setuptools.package-data]
ezrealm = ["static/*"]

[tool.setuptools.packages.find]
include = ["ezrealm*"]
