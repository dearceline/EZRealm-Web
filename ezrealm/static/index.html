<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EZRealm · 转发管理</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><div><div class="eyebrow">REALM v2.7.0 / CONTROL PANEL</div><h1>转发管理<span class="dot">.</span></h1><p>在一处管理 TCP 与 UDP，让每条连接有迹可循。</p></div><button id="logout" hidden>退出登录</button></header>
<div id="message" role="status" aria-live="polite"></div>
<section id="login"><div class="card narrow"><h2>登录管理面板</h2><p class="muted">通过安全的 SSH 隧道连接你的服务器。</p><form id="loginForm"><label>用户名<input name="username" autocomplete="username" required maxlength="64"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button class="primary">登录</button></form></div></section>
<section id="dashboard" hidden><div class="stats"><div class="card"><span>转发规则</span><strong id="count">0</strong></div><div class="card"><span>Realm 服务</span><strong id="service">—</strong></div><div class="card"><span>连接方式</span><strong class="small">SSH 隧道</strong></div></div>
<div class="toolbar"><div><button id="refresh">刷新</button><button id="start">启动服务</button><button id="stop">停止服务</button><button id="apply" class="primary">应用配置 / 重启</button></div><div><button id="export">导出规则</button><button id="fullExport">完整备份</button></div></div>
<p class="muted">保存规则后，点击“应用配置 / 重启”使其生效。重启会中断现有连接。</p>
<div class="card table-wrap"><table><thead><tr><th>序号</th><th>监听地址</th><th>远程地址</th><th>协议</th><th>备注</th><th>操作</th></tr></thead><tbody id="rules"></tbody></table><p id="empty" hidden>还没有转发规则，从下方添加第一条。</p></div>
<div class="columns"><section class="card"><h2 id="formTitle">添加转发规则</h2><form id="ruleForm"><label>监听地址<input name="listen" placeholder="0.0.0.0:8080" required maxlength="128"></label><label>远程地址<input name="remote" placeholder="[2001:db8::1]:443" required maxlength="270"></label><label>协议<select name="protocol"><option value="tcp+udp">TCP + UDP</option><option value="tcp">TCP</option><option value="udp">UDP</option></select></label><label>备注<input name="note" placeholder="例如：一号服务器" maxlength="512"></label><div class="actions"><button class="primary">保存规则</button><button id="cancelEdit" type="button" hidden>取消修改</button></div></form></section>
<section class="card"><h2>批量导入</h2><p class="muted">每行：序号|本地端口|远程IP:端口|备注<br>导入采用 TCP + UDP，追加到现有规则。</p><form id="importForm"><label>转发规则<textarea name="records" rows="8" placeholder="1|8080|192.168.1.1:8000|一号服务器&#10;2|9000|[2001:db8::1]:8080|IPv6服务器" required></textarea></label><button>导入规则</button></form><pre id="report" aria-live="polite"></pre></section></div></section>
<footer>EZRealm-Web · 配置修改自动备份 · 默认仅本机监听</footer></main>
<dialog id="confirm"><form method="dialog"><h2>确认操作</h2><p id="confirmText"></p><div class="actions"><button value="cancel">取消</button><button value="yes" class="primary">确认</button></div></form></dialog></body></html>
